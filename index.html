<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Алекс — гид по приложению</title>
<style>
:root {
  --bg0: #0c1409;
  --bg1: #111a0d;
  --bg2: #172112;
  --bg3: #1e2d18;
  --green: #2db561;
  --green2: #1e8c45;
  --lime: #c8f031;
  --lime2: #a8cd1a;
  --orange: #f4872a;
  --gold: #f5c842;
  --text: #eef6e2;
  --muted: #7da065;
  --border: rgba(80,160,60,.28);
  --shadow: 0 4px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{
  background:radial-gradient(ellipse at 30% 70%,#0d1f0a,#060a04);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
}

/* ─── PHONE ─────────────────────────────────── */
.phone{
  width:375px;height:812px;max-height:96vh;
  background:#000;border-radius:44px;padding:10px;
  box-shadow:0 0 0 1px #2a2a2a, var(--shadow), 0 0 80px rgba(0,180,60,.08);
  position:relative;flex-shrink:0;
}
.phone::before{
  content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:120px;height:30px;background:#000;border-radius:20px;z-index:99;
}
.screen{
  width:100%;height:100%;border-radius:36px;overflow:hidden;
  background:var(--bg0);position:relative;
}

/* ─── SCENE BG ──────────────────────────────── */
.scene{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 100% 60% at 50% 0%,#1a2e12 0%,transparent 65%),
    radial-gradient(ellipse 70% 40% at 85% 25%,#0f2008 0%,transparent 60%),
    linear-gradient(180deg,#0f1a0b 0%,#0c1409 50%,#080e06 100%);
}
.lamp{position:absolute;top:0;width:3px;height:55px;transform-origin:top center;}
.lamp::before{
  content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:22px;height:10px;background:#2a3520;border-radius:0 0 12px 12px;
}
.lamp::after{
  content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle,#f5e090,#e8b820);
  box-shadow:0 0 18px 8px rgba(240,200,60,.22);
}
.lamp.l1{left:18%;background:transparent;}
.lamp.l2{left:50%;background:transparent;}
.lamp.l3{left:82%;background:transparent;}

.shelf{position:absolute;left:0;right:0;height:8px;background:linear-gradient(180deg,#2a3520,#1a2212);border-radius:2px;}
.shelf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.01) 100%);}
.s1{top:22%}.s2{top:42%}.s3{top:62%}

.prod{position:absolute;display:flex;gap:2px;align-items:flex-end;}
.pi{border-radius:3px 3px 1px 1px}
.prod.pa{top:calc(22% - 30px);left:5%}
.prod.pb{top:calc(22% - 26px);left:55%}
.prod.pc{top:calc(42% - 28px);right:8%}
.prod.pd{top:calc(42% - 22px);left:12%}

.vig{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(0deg,rgba(6,10,4,.9) 0%,transparent 38%),
    radial-gradient(ellipse at 50% 110%,rgba(4,8,3,.7),transparent 55%);
}

/* ─── TOP BAR ───────────────────────────────── */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;padding:48px 14px 0}
.pill{
  display:inline-flex;align-items:center;gap:9px;
  background:rgba(10,20,8,.82);border:1px solid rgba(100,200,70,.22);
  border-radius:30px;padding:8px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.pill .star{font-size:14px}
.pill .t1{font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.5px}
.pill .t2{font-size:10px;color:var(--muted);margin-top:1px}

/* ─── CHARACTER SVG ─────────────────────────── */
.char-wrap{
  position:absolute;left:50%;bottom:212px;
  transform:translateX(-50%);
  width:220px;height:340px;z-index:10;
}
.char-svg{
  width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6)) drop-shadow(0 4px 12px rgba(0,200,80,.08));
}

#body-group{animation:breathe 3.8s ease-in-out infinite;transform-origin:50% 95%}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.022)}}

#head-group{animation:headfloat 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes headfloat{
  0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-3px) rotate(1deg)}
  70%{transform:translateY(-1.5px) rotate(-.7deg)}
}

#eye-l,#eye-r{animation:blink 4.5s infinite;transform-origin:50% 50%}
@keyframes blink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.05)}}

#arm-l{transform:rotate(12deg);transform-origin:55px 135px;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
#arm-r{transform:rotate(-12deg);transform-origin:165px 135px;transition:transform .55s cubic-bezier(.3,.9,.3,1)}

#mouth-smile{transition:d .4s;transition:opacity .3s}
#mouth-open{opacity:0;transition:opacity .3s}
#mouth-hmm{opacity:0;transition:opacity .3s}

#brow-l,#brow-r{transition:transform .4s cubic-bezier(.3,.9,.3,1)}
#cheek-l,#cheek-r{opacity:0;transition:opacity .4s}

.pose-think #arm-l{transform:rotate(-100deg) translateX(-8px);transform-origin:55px 135px}
.pose-think #brow-l{transform:rotate(-15deg) translateY(-2px)}
.pose-think #brow-r{transform:rotate(10deg) translateY(-2px)}
.pose-think #mouth-smile{opacity:0}
.pose-think #mouth-hmm{opacity:1}

.pose-point #arm-r{transform:rotate(-155deg) translateY(-4px);transform-origin:165px 135px}
.pose-point #brow-l{transform:rotate(-8deg) translateY(-2px)}

.pose-happy #arm-l{transform:rotate(-55deg);transform-origin:55px 135px}
.pose-happy #arm-r{transform:rotate(55deg);transform-origin:165px 135px}
.pose-happy #brow-l{transform:rotate(-12deg) translateY(-3px)}
.pose-happy #brow-r{transform:rotate(12deg) translateY(-3px)}
.pose-happy #mouth-smile{opacity:0}
.pose-happy #mouth-open{opacity:1}
.pose-happy #cheek-l,.pose-happy #cheek-r{opacity:1}

.pose-wink #arm-r{transform:rotate(-148deg);transform-origin:165px 135px}
.pose-wink #brow-l{transform:rotate(-18deg) translateY(-4px)}
.pose-wink #eye-l{transform:scaleY(.05);animation:none}
.pose-wink #cheek-l{opacity:.7}
.pose-wink #mouth-smile{opacity:0}
.pose-wink #mouth-hmm{opacity:1}

.pose-welcome #arm-r{transform:rotate(-170deg);transform-origin:165px 135px}
.pose-welcome #brow-l{transform:translateY(-2px)}
.pose-welcome #brow-r{transform:translateY(-2px)}

/* ─── BUBBLE ─────────────────────────────────── */
.bubble{
  position:absolute;left:14px;right:14px;bottom:196px;z-index:15;
  background:linear-gradient(145deg,rgba(18,35,12,.96),rgba(12,22,8,.98));
  border:1px solid rgba(80,160,50,.4);
  border-radius:22px 22px 22px 4px;
  padding:14px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(150,255,100,.06);
  opacity:0;transform:translateY(10px) scale(.97);
  transition:opacity .38s ease,transform .38s ease;
}
.bubble.show{opacity:1;transform:none}
.bubble .who{
  font-size:10px;font-weight:700;color:var(--lime);letter-spacing:.8px;
  display:flex;align-items:center;gap:7px;margin-bottom:7px;
}
.bubble .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.bubble .txt{font-size:15px;font-weight:500;color:var(--text);line-height:1.5;min-height:44px}
.cursor{display:inline-block;width:2px;height:1em;background:var(--lime);vertical-align:-2px;margin-left:1px;animation:cur .7s step-start infinite}
@keyframes cur{50%{opacity:0}}

/* ─── CHOICES ────────────────────────────────── */
.choices{
  position:absolute;left:12px;right:12px;bottom:28px;z-index:15;
  display:flex;flex-direction:column;gap:8px;
}
.ch{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(145deg,rgba(16,32,10,.95),rgba(10,22,6,.98));
  border:1.5px solid rgba(70,150,45,.4);
  border-radius:16px;padding:12px 14px;cursor:pointer;text-decoration:none;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  opacity:0;transform:translateY(14px);
  transition:opacity .35s ease,transform .35s ease,border-color .18s,background .18s,box-shadow .18s;
}
.ch.show{opacity:1;transform:none}
.ch:nth-child(1).show{transition-delay:.1s}
.ch:nth-child(2).show{transition-delay:.2s}
.ch:nth-child(3).show{transition-delay:.3s}
.ch:hover{background:linear-gradient(145deg,rgba(25,50,15,.98),rgba(18,35,10,.98));border-color:var(--lime);box-shadow:0 6px 28px rgba(100,220,50,.15)}
.ch:active{transform:scale(.97)!important}
.ch .ic{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.ch .lbl{flex:1}
.ch .lbl .main{font-size:14px;font-weight:700;color:var(--text);line-height:1.25}
.ch .lbl .sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.ch .arr{font-size:14px;color:var(--muted);flex-shrink:0}

/* ─── REWARD ─────────────────────────────────── */
.reward{
  position:absolute;inset:0;z-index:80;
  background:radial-gradient(ellipse at 50% 30%,#172e0e,#080f05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 24px;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.reward.show{opacity:1;pointer-events:auto}
.reward .big-em{font-size:86px;animation:pop .6s cubic-bezier(.3,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.reward .badge{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(30,60,15,.8);border:1px solid rgba(100,200,60,.35);
  border-radius:30px;padding:5px 14px;margin-top:14px;
  font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.5px;
}
.reward h2{font-size:22px;font-weight:800;color:var(--text);margin-top:12px;line-height:1.25}
.reward p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55;max-width:290px}
.reward .pts{
  font-size:36px;font-weight:800;color:var(--gold);
  margin-top:14px;display:flex;align-items:center;gap:8px;
}
.reward .links{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:20px}
.reward a.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:#fff;border-radius:16px;padding:14px 20px;
  font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 6px 22px rgba(30,140,60,.4);transition:transform .12s;
}
.reward a.btn-primary:active{transform:scale(.97)}
.reward a.btn-sec{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(20,40,12,.8);border:1.5px solid rgba(70,140,40,.35);
  color:var(--muted);border-radius:14px;padding:11px 20px;
  font-size:13px;font-weight:600;text-decoration:none;transition:border-color .15s,color .15s;
}
.reward a.btn-sec:hover{border-color:var(--lime);color:var(--text)}
.reward .restart{
  margin-top:10px;font-size:12px;color:rgba(100,140,80,.6);cursor:pointer;padding:8px;
  transition:color .18s;
}
.reward .restart:hover{color:var(--muted)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:0}}
</style>
</head>

 /* A6 — Апельсин */

/* ══════════════════════════════════════════════
   СЦЕНАРИЙ B — короткий и прямой
   Шаг 1: привет + раздел «Выгода»
   Шаг 2: выбери, что тебе ближе — 3 кнопки сразу
   Шаг 3: получи свой раздел
   ══════════════════════════════════════════════ */
const SB = [

 /* B0 — приветствие */
 {
  pose: "welcome",
  text: "Привет! Я Алекс 👋 Я расскажу, как максимально выгодно покупать в Перекрёстке. Начнём с главного — узнать про свои успехи в экономии можно в разделе «Выгода». Загляни туда?",

   { ic:"🤔", main:"Сначала расскажи, что там есть", sub:"Хочу понять, прежде чем идти", next:1 },
  ]
 },

 /* B1 — выбор: что тебе ближе */
 {

  text: "Расскажи, что тебе ближе — я покажу именно нужный раздел:",
  choices: [
   { ic:"🎮", main:"Играть и зарабатывать скидки", sub:"Игра с офферами от брендов", next:"r:game" },
   { ic:"🏷️", main:"Активировать персональные предложения", sub:"Офферы именно на мои товары", next:"r:personal" },
   { ic:"📦", main:"Выбрать любимые категории товаров", sub:"Повышенный кешбэк на широкий список", next:"r:categories" },

];

/* ─── НАГРАДЫ (общие для обоих сценариев) ──── */
const R = {

 profit: {
  em:"💰", badge:"★ ТВОЯ ВЫГОДА",
  h2:"Раздел «Выгода» открыт!",
  p:"Здесь твой кешбэк, все активные офферы и история экономии. Один экран — всё твоё.",
  pts:"+150 ✕",
  links:[
   { label:"💰 Открыть «Выгода»", href:"tsxapp://app/profitRoot", primary:true },
   { label:"↩ Назад к Алексу", reset:true },
  ]
 },

 personal: {
  em:"🎁", badge:"★ ТОЛЬКО ДЛЯ ТЕБЯ",
  h2:"Персональные офферы ждут!",
  p:"Кешбэк именно на твои любимые товары — магазин уже подготовил подборку. Активируй и забирай деньги.",
  pts:"+300 ✕",
  links:[
   { label:"🏷️ Открыть персональные офферы", href:"tsxapp://app/personal_offers_list", primary:true },
   { label:"↩ Назад к Алексу", reset:true },
  ]
 },

 categories: {
  em:"🛒", badge:"★ ШИРОКАЯ ЭКОНОМИЯ",
  h2:"Любимые категории — выбирай!",
  p:"Целые группы товаров с повышенным кешбэком. Выбери, что берёшь чаще всего, — и экономь на каждой покупке.",
  pts:"+250 ✕",
  links:[
   { label:"📦 Выбрать категории", href:"tsxapp://app/push?url=https%3A%2F%2Fperekrestok-mobile.x5.ru%2Floyalty%2Flevel%2Ffavorite-categories", primary:true },
   { label:"↩ Назад к Алексу", reset:true },

 },

 apelsin: {
  em:"🍊", badge:"★ ТУРБО-КЕШБЭК",
  h2:"Карта Апельсин — твой усилитель!",
  p:"Повышенный кешбэк поверх всех остальных акций. Подключи один раз и получай больше с каждой покупки.",
  pts:"+200 ✕",
  links:[
   { label:"🍊 Открыть личный кабинет", href:"tsxapp://app/local_webview?url=https%3A%2F%2Fmyapelsin.ru%2Fcard%2Fonboarding%3Futm_source%3Dcrm_x5club%26utm_medium%3Demail%26utm_campaign%3Dmas_geim_holodilnik_korzina_act%26utm_content%3Dx5club%26platformId%3Doffline_partners_xplatformplati500_crm_x5club_email_mas_geim_holodilnik_korzina_act_x5club", primary:true },
   { label:"↩ Назад к Алексу", reset:true },
  ]
 },

 game: {
  em:"🎮", badge:"★ ИГРАЙ И ВЫИГРЫВАЙ",

  p:"Находи жанры, которые нравятся, проходи уровни — и получай эксклюзивные офферы от брендов прямо в процессе.",
  pts:"+100 ✕",
  links:[
   { label:"🎮 Открыть игру", href:"tsxapp://app/fullscreen_webview?url=https%3A%2F%2Fgp.x5.ru%2Fcosmoperek", primary:true },
   { label:"↩ Назад к Алексу", reset:true },
  ]
 },

};

/* ─── ВЫБОР СЦЕНАРИЯ ───────────────────────────
   Случайно 50/50 при каждом открытии страницы.
   ──────────────────────────────────────────── */
const S = Math.random() < 0.5 ? SA : SB;

/* ─── ДВИЖОК (не менять) ───────────────────── */
const char   = document.getElementById("char");
const bubble = document.getElementById("bubble");
const btxt   = document.getElementById("btxt");
const choices= document.getElementById("choices");
let typer = null;

function setPose(p){ char.className = "char-wrap pose-"+p; }

function type(text, done){
 clearInterval(typer);
 btxt.textContent = "";
 let i = 0;
 const cur = document.createElement("span");
 cur.className = "cursor";
 typer = setInterval(()=>{
  btxt.textContent = text.slice(0,++i);
  btxt.appendChild(cur);
  if(i>=text.length){ clearInterval(typer); if(done) done(); }
 }, 18);
}

function showStep(n){
 const step = S[n];
 setPose(step.pose);
 bubble.classList.remove("show");
 choices.innerHTML = "";
 setTimeout(()=>{
  bubble.classList.add("show");
  type(step.text, ()=>{
   step.choices.forEach((c,i)=>{
    const el = document.createElement("div");
    el.className = "ch";
    el.innerHTML = `
     <span class="ic">${c.ic}</span>
     <span class="lbl">
      <span class="main">${c.main}</span>
      ${c.sub?`<span class="sub">${c.sub}</span>`:""}
     </span>
     <span class="arr">›</span>
    `;
    el.onclick = ()=> go(c.next);
    choices.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
   });
  });
 },160);
}

function go(next){
 if(typeof next === "number"){ showStep(next); }
 else if(typeof next === "string" && next.startsWith("r:")){ showReward(next.slice(2)); }
}

function showReward(key){
 const r = R[key];
 document.getElementById("rem").textContent = r.em;
 document.getElementById("rbadge").textContent = r.badge;
 document.getElementById("rh2").textContent = r.h2;
 document.getElementById("rp").textContent = r.p;
 document.getElementById("rpts").innerHTML = `<span>${r.pts}</span><span style="font-size:24px;color:var(--lime)">✕</span>`;
 const lk = document.getElementById("rlinks");
 lk.innerHTML = "";
 r.links.forEach(l=>{
  if(l.reset){
   const a = document.createElement("a");
   a.href="#"; a.className="btn-sec"; a.textContent=l.label;
   a.onclick=e=>{e.preventDefault();restart();};
   lk.appendChild(a);
  } else {
   const a = document.createElement("a");
   a.href=l.href; a.className=l.primary?"btn-primary":"btn-sec";
   a.textContent=l.label;
   lk.appendChild(a);
  }
 });
 confetti();
 setPose("happy");
 bubble.classList.remove("show");
 choices.innerHTML="";
 document.getElementById("reward").classList.add("show");
}

function restart(){
 document.getElementById("reward").classList.remove("show");
 document.getElementById("confetti").innerHTML="";
 showStep(0);
}

function confetti(){
 const c = document.getElementById("confetti");
 c.innerHTML="";
 const cols=["#c8f031","#f5c842","#2db561","#ffffff","#f4872a","#80e0a0"];
 for(let i=0;i<52;i++){
  const s=document.createElement("i");
  const col=cols[Math.floor(Math.random()*cols.length)];
  s.style.cssText=`
   left:${Math.random()*100}%;
   background:${col};
   width:${5+Math.random()*7}px;
   height:${9+Math.random()*11}px;
   animation-duration:${1.6+Math.random()*2.2}s;
   animation-delay:${Math.random()*.5}s;
   transform:rotate(${Math.random()*360}deg);
  `;
  c.appendChild(s);
 }
}

showStep(0);
</script>
